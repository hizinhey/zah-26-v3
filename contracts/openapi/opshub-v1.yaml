openapi: 3.1.0
info:
  title: OpsHub API
  version: 1.0.0
  description: Canonical REST and Local Hub transport contracts for the Android MVP.
servers:
  - url: /
paths:
  /api/v1/operations:
    post:
      summary: Create a test operation
      operationId: createOperation
      responses:
        '201':
          description: Created operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
  /api/v1/operations/{operationId}:
    get:
      summary: Get a test operation
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
  /api/v1/hubs/{hubId}/jobs/next:
    get:
      summary: Long-poll the next Hub job
      operationId: getNextHubJob
      parameters:
        - $ref: '#/components/parameters/HubId'
        - name: waitSeconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
      responses:
        '200':
          description: Hub envelope containing a job offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubEnvelopeV1'
        '204':
          description: No job available
  /api/v1/hubs/{hubId}/heartbeats:
    post:
      summary: Send a Hub heartbeat
      operationId: sendHubHeartbeat
      parameters:
        - $ref: '#/components/parameters/HubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubEnvelopeV1'
      responses:
        '204':
          description: Heartbeat accepted
  /ws/v1/hubs/{hubId}:
    get:
      summary: WebSocket endpoint for HubEnvelopeV1 messages
      operationId: connectHubWebSocket
      parameters:
        - $ref: '#/components/parameters/HubId'
      responses:
        '101':
          description: Switching Protocols
components:
  parameters:
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    HubId:
      name: hubId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    Uuid:
      type: string
      format: uuid
    Revision:
      type: integer
      minimum: 1
    Timestamp:
      type: string
      format: date-time
    FieldStatus:
      type: string
      enum: [PASSED, WARNING, FAILED, UNABLE_TO_CHECK, INVALID]
    OperationStatus:
      type: string
      enum: [DRAFT, VALIDATING, VALIDATION_FAILED, VALIDATED, GENERATING, GENERATION_FAILED, READY_FOR_APPROVAL, APPROVED, QUEUED, RUNNING, PASSED, FAILED, ERROR]
    TestCaseStatus:
      type: string
      enum: [PENDING, READY, RUNNING, PASSED, FAILED, ERROR]
    TestResultStatus:
      type: string
      enum: [PASSED, FAILED, ERROR]
    ErrorCategory:
      type: string
      enum: [ASSERTION_FAILURE, INFRASTRUCTURE, TIMEOUT, CONFIGURATION, UNKNOWN]
    TemplateParametersV1:
      type: object
      additionalProperties: false
      required: [oaName, thumbnailUrl, expectedHeader, expectedBody, expectedButtonText, expectedRedirectUrl, expectedRedirectDomain]
      properties:
        oaName: { type: string, minLength: 1 }
        thumbnailUrl: { type: string, format: uri }
        expectedHeader: { type: string, minLength: 1 }
        expectedBody: { type: string, minLength: 1 }
        expectedButtonText: { type: string, minLength: 1 }
        expectedRedirectUrl: { type: string, format: uri }
        expectedRedirectDomain: { type: string, minLength: 1 }
    HubEnvelopeV1:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type:
          type: string
          enum: [JOB_OFFERED, JOB_PROGRESS, TEST_RESULT, HEARTBEAT]
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload:
          type: object
    Operation:
      type: object
      additionalProperties: false
      required: [id, jiraId, revision, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        jiraId: { type: string, minLength: 1 }
        revision: { $ref: '#/components/schemas/Revision' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
