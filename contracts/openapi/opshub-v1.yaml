openapi: 3.1.0
info:
  title: OpsHub API
  version: 1.0.0
  description: Canonical REST and Local Hub transport contracts for the Android MVP.
servers:
  - url: /
paths:
  /api/v1/operations:
    post:
      summary: Create a test operation
      operationId: createOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperationRequest'
      responses:
        '201':
          description: Created operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
  /api/v1/operations/{operationId}:
    get:
      summary: Get a test operation
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
  /api/v1/operations/{operationId}/oas:
    put:
      summary: Replace the ordered official accounts for an operation
      operationId: replaceOperationOas
      parameters:
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceOasRequest'
      responses:
        '200':
          description: Updated operation with persisted official accounts in OA order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Invalid request or unsupported platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
        '409':
          description: The expected revision is stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionConflictError'
  /api/v1/operations/{operationId}/validate:
    post:
      summary: Validate the current operation revision and return generation gating
      operationId: validateOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateOperationRequest'
      responses:
        '200':
          description: Persisted validation findings and generation readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRun'
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
        '409':
          description: The expected revision is stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionConflictError'
  /api/v1/hubs:
    get:
      summary: List known Hubs and their connectivity state (operator-facing, for the Hub status indicator)
      operationId: listHubs
      responses:
        '200':
          description: Hubs ordered by most recently active first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HubSummary'
  /api/v1/hubs/{hubId}/jobs/next:
    get:
      summary: Long-poll the next Hub job
      operationId: getNextHubJob
      parameters:
        - $ref: '#/components/parameters/HubId'
        - name: waitSeconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
      responses:
        '200':
          description: Hub envelope containing a job offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubEnvelopeV1'
        '204':
          description: No job available
  /api/v1/hubs/{hubId}/heartbeats:
    post:
      summary: Send a Hub heartbeat
      operationId: sendHubHeartbeat
      parameters:
        - $ref: '#/components/parameters/HubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubEnvelopeV1'
      responses:
        '204':
          description: Heartbeat accepted
  /ws/v1/hubs/{hubId}:
    get:
      summary: WebSocket endpoint for HubEnvelopeV1 messages
      operationId: connectHubWebSocket
      parameters:
        - $ref: '#/components/parameters/HubId'
      responses:
        '101':
          description: Switching Protocols
components:
  parameters:
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    HubId:
      name: hubId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    Uuid:
      type: string
      format: uuid
    Revision:
      type: integer
      minimum: 1
    Timestamp:
      type: string
      format: date-time
    FieldStatus:
      type: string
      enum: [PASSED, WARNING, FAILED, UNABLE_TO_CHECK, INVALID]
    OperationStatus:
      type: string
      enum: [DRAFT, VALIDATING, VALIDATION_FAILED, VALIDATED, GENERATING, GENERATION_FAILED, READY_FOR_APPROVAL, APPROVED, QUEUED, RUNNING, PASSED, FAILED, ERROR]
    TestCaseStatus:
      type: string
      enum: [PENDING, READY, RUNNING, PASSED, FAILED, ERROR]
    TestResultStatus:
      type: string
      enum: [PASSED, FAILED, ERROR]
    ErrorCategory:
      type: string
      enum: [ASSERTION_FAILURE, INFRASTRUCTURE, TIMEOUT, CONFIGURATION, UNKNOWN]
    CreateOperationRequest:
      type: object
      additionalProperties: false
      required: [jiraId]
      properties:
        jiraId: { type: string, minLength: 1 }
    OfficialAccountInput:
      type: object
      additionalProperties: false
      required: [platform, oaName, thumbnailUrl, content, buttonText, redirectUrl]
      properties:
        platform: { enum: [ANDROID, WEB] }
        oaName: { type: string, minLength: 1 }
        thumbnailUrl: { type: string, format: uri }
        content: { type: string, minLength: 1 }
        buttonText: { type: string, minLength: 1 }
        redirectUrl: { type: string, format: uri }
    ReplaceOasRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, oas]
      properties:
        expectedRevision: { $ref: '#/components/schemas/Revision' }
        oas:
          type: array
          description: Accounts are persisted in this array order as OA order 1..N.
          items: { $ref: '#/components/schemas/OfficialAccountInput' }
    ValidateOperationRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { $ref: '#/components/schemas/Revision' }
    OfficialAccount:
      type: object
      additionalProperties: false
      required: [id, oaOrder, platform, oaName, thumbnailUrl, content, buttonText, redirectUrl]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        oaOrder: { type: integer, minimum: 1 }
        platform: { enum: [ANDROID, WEB] }
        oaName: { type: string, minLength: 1 }
        thumbnailUrl: { type: string, format: uri }
        content: { type: string, minLength: 1 }
        buttonText: { type: string, minLength: 1 }
        redirectUrl: { type: string, format: uri }
    OperationError:
      type: object
      additionalProperties: false
      required: [code, message, currentRevision]
      properties:
        code: { type: string, enum: [INVALID_REQUEST, UNSUPPORTED_PLATFORM, OPERATION_NOT_FOUND] }
        message: { type: string }
        currentRevision:
          anyOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'
    RevisionConflictError:
      type: object
      additionalProperties: false
      required: [code, message, currentRevision]
      properties:
        code: { const: REVISION_CONFLICT }
        message: { type: string }
        currentRevision: { $ref: '#/components/schemas/Revision' }
    FieldFinding:
      type: object
      additionalProperties: false
      required: [fieldName, validatorType, status]
      properties:
        fieldName: { type: string }
        validatorType: { type: string }
        status: { $ref: '#/components/schemas/FieldStatus' }
        issue: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        suggestion: { type: [string, 'null'] }
        severity: { type: [string, 'null'] }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
    ValidationRun:
      type: object
      additionalProperties: false
      required: [id, operationId, sourceRevision, status, findings, canGenerate, generateDisabledReasons]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        operationId: { $ref: '#/components/schemas/Uuid' }
        sourceRevision: { $ref: '#/components/schemas/Revision' }
        status:
          type: string
          enum: [VALIDATION_FAILED, VALIDATED]
        findings:
          type: array
          items: { $ref: '#/components/schemas/FieldFinding' }
        canGenerate: { type: boolean }
        generateDisabledReasons:
          type: array
          items: { type: string }
    TemplateParametersV1:
      type: object
      additionalProperties: false
      required: [oaName, thumbnailUrl, expectedHeader, expectedBody, expectedButtonText, expectedRedirectUrl, expectedRedirectDomain]
      properties:
        oaName: { type: string, minLength: 1 }
        thumbnailUrl: { type: string, format: uri }
        expectedHeader: { type: string, minLength: 1 }
        expectedBody: { type: string, minLength: 1 }
        expectedButtonText: { type: string, minLength: 1 }
        expectedRedirectUrl: { type: string, format: uri }
        expectedRedirectDomain: { type: string, minLength: 1 }
    HubSummary:
      type: object
      required: [id, name, createdAt, platforms]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/HubPlatformStatus'
    HubPlatformStatus:
      type: object
      required: [platform, connectionStatus, transport, deviceReady, runnerReady]
      properties:
        platform:
          type: string
          enum: [ANDROID, WEB]
        connectionStatus:
          type: string
          enum: [ONLINE, OFFLINE]
        transport:
          type: string
          enum: [WEBSOCKET, HTTPS_POLLING]
        deviceReady:
          type: boolean
        runnerReady:
          type: boolean
        lastHeartbeatAt:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    HubEnvelopeV1:
      oneOf:
        - $ref: '#/components/schemas/JobOfferedEnvelope'
        - $ref: '#/components/schemas/JobProgressEnvelope'
        - $ref: '#/components/schemas/TestResultEnvelope'
        - $ref: '#/components/schemas/HeartbeatEnvelope'
      discriminator:
        propertyName: type
        mapping:
          JOB_OFFERED: '#/components/schemas/JobOfferedEnvelope'
          JOB_PROGRESS: '#/components/schemas/JobProgressEnvelope'
          TEST_RESULT: '#/components/schemas/TestResultEnvelope'
          HEARTBEAT: '#/components/schemas/HeartbeatEnvelope'
    JobOfferedEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type: { const: JOB_OFFERED }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/JobOfferedPayload' }
    JobProgressEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type: { const: JOB_PROGRESS }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/JobProgressPayload' }
    TestResultEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type: { const: TEST_RESULT }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/TestResultPayload' }
    HeartbeatEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type: { const: HEARTBEAT }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/HeartbeatPayload' }
    TestCase:
      type: object
      additionalProperties: false
      required: [testCaseId, oaOrder, oaName, order, templateId, templateVersion, parameters]
      properties:
        testCaseId: { $ref: '#/components/schemas/Uuid' }
        oaOrder: { type: integer, minimum: 1 }
        oaName: { type: string, minLength: 1 }
        order: { type: integer, minimum: 1, maximum: 5 }
        templateId:
          type: string
          enum:
            - android-oa-delivery-v1
            - android-thumbnail-v1
            - android-content-v1
            - android-button-text-v1
            - android-redirect-v1
        templateVersion: { type: integer, minimum: 1 }
        parameters: { $ref: '#/components/schemas/TemplateParametersV1' }
    OrderedTestCases:
      description: >-
        N groups of exactly 5 test cases (one group per OA), grouped by oaOrder.
        Within each group, order runs 1-5 with a fixed templateId per position -
        see contracts/schemas/hub-envelope-v1.json and
        local-hub/src/opshub_hub/models.py for the code-level grouping check
        (not fully expressible in pure JSON Schema/OpenAPI across group boundaries).
      type: array
      minItems: 5
      items: { $ref: '#/components/schemas/TestCase' }
    JobOfferedPayload:
      type: object
      additionalProperties: false
      required: [executionId, idempotencyKey, revision, platform, testCases]
      properties:
        executionId: { $ref: '#/components/schemas/Uuid' }
        idempotencyKey: { type: string, minLength: 1 }
        revision: { $ref: '#/components/schemas/Revision' }
        platform: { const: ANDROID }
        testCases: { $ref: '#/components/schemas/OrderedTestCases' }
    JobProgressPayload:
      type: object
      additionalProperties: false
      required: [executionId, testCaseId, status, message]
      properties:
        executionId: { $ref: '#/components/schemas/Uuid' }
        testCaseId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/TestCaseStatus' }
        message: { type: string }
    TestResultPayload:
      type: object
      additionalProperties: false
      required: [executionId, testCaseId, attempt, status, durationMs, errorCategory]
      properties:
        executionId: { $ref: '#/components/schemas/Uuid' }
        testCaseId: { $ref: '#/components/schemas/Uuid' }
        attempt: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/TestResultStatus' }
        durationMs: { type: integer, minimum: 0 }
        errorCategory:
          anyOf:
            - $ref: '#/components/schemas/ErrorCategory'
            - type: 'null'
        errorMessage:
          anyOf:
            - type: string
            - type: 'null'
    HeartbeatPayload:
      type: object
      additionalProperties: false
      required: [deviceReady, runnerReady]
      properties:
        deviceReady: { type: boolean }
        runnerReady: { type: boolean }
    Operation:
      type: object
      additionalProperties: false
      required: [id, jiraId, revision, status, createdAt, updatedAt, oas]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        jiraId: { type: string, minLength: 1 }
        revision: { $ref: '#/components/schemas/Revision' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        oas:
          type: array
          items: { $ref: '#/components/schemas/OfficialAccount' }
