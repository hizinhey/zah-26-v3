openapi: 3.1.0
info:
  title: OpsHub API
  version: 1.0.0
  description: Canonical REST and Local Hub transport contracts for the Android MVP.
servers:
  - url: /
paths:
  /api/v1/operations:
    post:
      summary: Create a test operation
      operationId: createOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperationRequest'
      responses:
        '201':
          description: Created operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
  /api/v1/operations/{operationId}:
    get:
      summary: Get a test operation
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
  /api/v1/operations/{operationId}/oas:
    put:
      summary: Replace the ordered official accounts for an operation
      operationId: replaceOperationOas
      parameters:
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceOasRequest'
      responses:
        '200':
          description: Updated operation with persisted official accounts in OA order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Invalid request or unsupported platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
        '409':
          description: The expected revision is stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionConflictError'
  /api/v1/hubs/{hubId}/jobs/next:
    get:
      summary: Long-poll the next Hub job
      operationId: getNextHubJob
      parameters:
        - $ref: '#/components/parameters/HubId'
        - name: waitSeconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
      responses:
        '200':
          description: Hub envelope containing a job offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubEnvelopeV1'
        '204':
          description: No job available
  /api/v1/hubs/{hubId}/heartbeats:
    post:
      summary: Send a Hub heartbeat
      operationId: sendHubHeartbeat
      parameters:
        - $ref: '#/components/parameters/HubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubEnvelopeV1'
      responses:
        '204':
          description: Heartbeat accepted
  /ws/v1/hubs/{hubId}:
    get:
      summary: WebSocket endpoint for HubEnvelopeV1 messages
      operationId: connectHubWebSocket
      parameters:
        - $ref: '#/components/parameters/HubId'
      responses:
        '101':
          description: Switching Protocols
components:
  parameters:
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    HubId:
      name: hubId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    Uuid:
      type: string
      format: uuid
    Revision:
      type: integer
      minimum: 1
    Timestamp:
      type: string
      format: date-time
    FieldStatus:
      type: string
      enum: [PASSED, WARNING, FAILED, UNABLE_TO_CHECK, INVALID]
    OperationStatus:
      type: string
      enum: [DRAFT, VALIDATING, VALIDATION_FAILED, VALIDATED, GENERATING, GENERATION_FAILED, READY_FOR_APPROVAL, APPROVED, QUEUED, RUNNING, PASSED, FAILED, ERROR]
    TestCaseStatus:
      type: string
      enum: [PENDING, READY, RUNNING, PASSED, FAILED, ERROR]
    TestResultStatus:
      type: string
      enum: [PASSED, FAILED, ERROR]
    ErrorCategory:
      type: string
      enum: [ASSERTION_FAILURE, INFRASTRUCTURE, TIMEOUT, CONFIGURATION, UNKNOWN]
    CreateOperationRequest:
      type: object
      additionalProperties: false
      required: [jiraId]
      properties:
        jiraId: { type: string, minLength: 1 }
    OfficialAccountInput:
      type: object
      additionalProperties: false
      required: [platform, oaName, thumbnailUrl, content, buttonText, redirectUrl]
      properties:
        platform: { const: ANDROID }
        oaName: { type: string, minLength: 1 }
        thumbnailUrl: { type: string, format: uri }
        content: { type: string, minLength: 1 }
        buttonText: { type: string, minLength: 1 }
        redirectUrl: { type: string, format: uri }
    ReplaceOasRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, oas]
      properties:
        expectedRevision: { $ref: '#/components/schemas/Revision' }
        oas:
          type: array
          description: Accounts are persisted in this array order as OA order 1..N.
          items: { $ref: '#/components/schemas/OfficialAccountInput' }
    OfficialAccount:
      type: object
      additionalProperties: false
      required: [id, oaOrder, platform, oaName, thumbnailUrl, content, buttonText, redirectUrl]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        oaOrder: { type: integer, minimum: 1 }
        platform: { const: ANDROID }
        oaName: { type: string, minLength: 1 }
        thumbnailUrl: { type: string, format: uri }
        content: { type: string, minLength: 1 }
        buttonText: { type: string, minLength: 1 }
        redirectUrl: { type: string, format: uri }
    OperationError:
      type: object
      additionalProperties: false
      required: [code, message, currentRevision]
      properties:
        code: { type: string, enum: [INVALID_REQUEST, UNSUPPORTED_PLATFORM, OPERATION_NOT_FOUND] }
        message: { type: string }
        currentRevision:
          anyOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'
    RevisionConflictError:
      type: object
      additionalProperties: false
      required: [code, message, currentRevision]
      properties:
        code: { const: REVISION_CONFLICT }
        message: { type: string }
        currentRevision: { $ref: '#/components/schemas/Revision' }
    TemplateParametersV1:
      type: object
      additionalProperties: false
      required: [oaName, thumbnailUrl, expectedHeader, expectedBody, expectedButtonText, expectedRedirectUrl, expectedRedirectDomain]
      properties:
        oaName: { type: string, minLength: 1 }
        thumbnailUrl: { type: string, format: uri }
        expectedHeader: { type: string, minLength: 1 }
        expectedBody: { type: string, minLength: 1 }
        expectedButtonText: { type: string, minLength: 1 }
        expectedRedirectUrl: { type: string, format: uri }
        expectedRedirectDomain: { type: string, minLength: 1 }
    HubEnvelopeV1:
      oneOf:
        - $ref: '#/components/schemas/JobOfferedEnvelope'
        - $ref: '#/components/schemas/JobProgressEnvelope'
        - $ref: '#/components/schemas/TestResultEnvelope'
        - $ref: '#/components/schemas/HeartbeatEnvelope'
      discriminator:
        propertyName: type
        mapping:
          JOB_OFFERED: '#/components/schemas/JobOfferedEnvelope'
          JOB_PROGRESS: '#/components/schemas/JobProgressEnvelope'
          TEST_RESULT: '#/components/schemas/TestResultEnvelope'
          HEARTBEAT: '#/components/schemas/HeartbeatEnvelope'
    JobOfferedEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type: { const: JOB_OFFERED }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/JobOfferedPayload' }
    JobProgressEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type: { const: JOB_PROGRESS }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/JobProgressPayload' }
    TestResultEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type: { const: TEST_RESULT }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/TestResultPayload' }
    HeartbeatEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, version, type, timestamp, payload]
      properties:
        messageId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, const: 1 }
        type: { const: HEARTBEAT }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        payload: { $ref: '#/components/schemas/HeartbeatPayload' }
    TestCase:
      type: object
      additionalProperties: false
      required: [testCaseId, order, templateId, templateVersion, parameters]
      properties:
        testCaseId: { $ref: '#/components/schemas/Uuid' }
        order: { type: integer, minimum: 1 }
        templateId: { type: string, minLength: 1 }
        templateVersion: { type: integer, minimum: 1 }
        parameters: { $ref: '#/components/schemas/TemplateParametersV1' }
    OrderedTestCases:
      type: array
      minItems: 5
      maxItems: 5
      prefixItems:
        - allOf:
            - $ref: '#/components/schemas/TestCase'
            - properties:
                order: { const: 1 }
                templateId: { const: android-oa-delivery-v1 }
        - allOf:
            - $ref: '#/components/schemas/TestCase'
            - properties:
                order: { const: 2 }
                templateId: { const: android-thumbnail-v1 }
        - allOf:
            - $ref: '#/components/schemas/TestCase'
            - properties:
                order: { const: 3 }
                templateId: { const: android-content-v1 }
        - allOf:
            - $ref: '#/components/schemas/TestCase'
            - properties:
                order: { const: 4 }
                templateId: { const: android-button-text-v1 }
        - allOf:
            - $ref: '#/components/schemas/TestCase'
            - properties:
                order: { const: 5 }
                templateId: { const: android-redirect-v1 }
      items: false
    JobOfferedPayload:
      type: object
      additionalProperties: false
      required: [executionId, idempotencyKey, revision, platform, testCases]
      properties:
        executionId: { $ref: '#/components/schemas/Uuid' }
        idempotencyKey: { type: string, minLength: 1 }
        revision: { $ref: '#/components/schemas/Revision' }
        platform: { const: ANDROID }
        testCases: { $ref: '#/components/schemas/OrderedTestCases' }
    JobProgressPayload:
      type: object
      additionalProperties: false
      required: [executionId, testCaseId, status, message]
      properties:
        executionId: { $ref: '#/components/schemas/Uuid' }
        testCaseId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/TestCaseStatus' }
        message: { type: string }
    TestResultPayload:
      type: object
      additionalProperties: false
      required: [executionId, testCaseId, attempt, status, durationMs, errorCategory]
      properties:
        executionId: { $ref: '#/components/schemas/Uuid' }
        testCaseId: { $ref: '#/components/schemas/Uuid' }
        attempt: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/TestResultStatus' }
        durationMs: { type: integer, minimum: 0 }
        errorCategory:
          anyOf:
            - $ref: '#/components/schemas/ErrorCategory'
            - type: 'null'
    HeartbeatPayload:
      type: object
      additionalProperties: false
      required: [deviceReady, runnerReady]
      properties:
        deviceReady: { type: boolean }
        runnerReady: { type: boolean }
    Operation:
      type: object
      additionalProperties: false
      required: [id, jiraId, revision, status, createdAt, updatedAt, oas]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        jiraId: { type: string, minLength: 1 }
        revision: { $ref: '#/components/schemas/Revision' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        oas:
          type: array
          items: { $ref: '#/components/schemas/OfficialAccount' }
