worker_processes  auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Static assets: hashed filenames, cache aggressively.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Everything else falls back to index.html so react-router's
        # createBrowserRouter (HTML5 history mode) works on hard refresh
        # and deep links.
        location / {
            try_files $uri /index.html;
        }
    }
}
