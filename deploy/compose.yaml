services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opshub}
      POSTGRES_USER: ${POSTGRES_USER:-opshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opshub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: opshub-backend:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-opshub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-opshub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-opshub}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evidence-data:/var/lib/opshub/evidence

  frontend:
    image: opshub-frontend:latest

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"

volumes:
  postgres-data:
  evidence-data:
