spring:
  application:
    name: opshub-backend
  datasource:
    url: ${OPSHUB_DATABASE_URL:jdbc:postgresql://localhost:5432/opshub}
    username: ${OPSHUB_DATABASE_USERNAME:opshub}
    password: ${OPSHUB_DATABASE_PASSWORD:opshub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
opshub:
  validation:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      request-timeout: 5s
    thumbnail:
      connect-timeout: 2s
      request-timeout: 3s
      max-bytes: 5242880
      max-redirects: 5
  generation:
    templates:
      catalog-version: ${OPSHUB_TEMPLATE_CATALOG_VERSION:android-v1}
      template-root: ${OPSHUB_TEMPLATE_ROOT:local-hub/templates/android}
      node-executable: ${OPSHUB_NODE_EXECUTABLE:}
      tsc-entry: ${OPSHUB_TSC_ENTRY:}
      compiler-timeout: ${OPSHUB_TSC_TIMEOUT:30s}
server:
  error:
    include-message: never
