[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opshub-local-hub"
version = "0.1.0"
description = "OpsHub Android Local Hub"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
